[project]
name = "worldcup-iq"
version = "0.1.0"
description = "Player-composition World Cup predictions with honest evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Data
    "pandas>=2.0",
    "pyarrow>=14.0",
    "statsbombpy>=1.11",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.5",
    "lxml>=5.0",

    # ML / Stats
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",

    # Visualization / Dashboard
    "streamlit>=1.30",
    "plotly>=5.18",

    # Utilities
    "tqdm>=4.66",
    "python-dateutil>=2.8",
    "python-dotenv>=1.0",
    "kaggle>=1.6",
]

[project.optional-dependencies]
bayesian = ["pymc>=5.0", "arviz>=0.15"]
torch = [
    "torch>=2.1",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "ipykernel>=6.0",
    "jupyter>=1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
